apiVersion: app/v1
kind: replicaSet
metadata: 
  name: nginx
  labels: # these are replicaset labels.
    app: nginx
    tier: frontend
spec:
  replicas: 2
  selector: 
    # these are used to select the pod to create replicas.
    matchlabes:
      tier: frontend
      app: nginx
  template: # this is pod template.
    metadata:
      # these labels belongs to pod.
      labels:
        tier: frontend
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx