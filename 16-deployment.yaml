apiVersion: apps/v1
kind: Deployment

metadata:
  name: nginx
  namespace: expense
  labels:
    app: nginx
    tier: frontend

spec:
  replicas: 2

  selector:
    matchLabels:
      tier: frontend
      app: nginx

  template:
    metadata:
      labels:
        tier: frontend
        app: nginx

    spec:
      containers:
      - name: nginx
        image: nginx

---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: expense
spec:
  selector:
    tier: frontend 
    app: nginx

  ports:
  - name: nginx-svc-port
    protocol: TCP
    port: 80 # this is service port
    targetPort: 80 # this is container port