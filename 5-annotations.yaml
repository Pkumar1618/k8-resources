# In Kubernetes, Annotations are key-value pairs used to attach additional information or metadata to Kubernetes resources.
# You want to store additional information such as Application owner, Build version,Git repository URL, Deployment date, Contact information, Monitoring configuration

apiVersion: v1
kind: Pod
metadata:
  name: annotations
  annotations: 
    imageregistry: "https://hub.docker.com/"
    buildURL: "https://jenkins.joindevops.com/expense/backend/build/67"
spec:
  containers:
  - name: nginx
    image: nginx